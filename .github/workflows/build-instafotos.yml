name: Gerar InstaFotos (Windows)

on:
  push:
    paths:
      - 'instafotos/**'
      - '.github/workflows/build-instafotos.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: instafotos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar instalador
        shell: cmd
        run: gerar-instalador.bat
      - uses: actions/upload-artifact@v4
        with:
          name: InstaFotos-Windows
          path: instafotos/release/*.exe
