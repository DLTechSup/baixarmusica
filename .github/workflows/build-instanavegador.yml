name: Gerar InstaNavegador (Windows)

on:
  push:
    paths:
      - 'instanavegador/**'
      - '.github/workflows/build-instanavegador.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: instanavegador
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testar
        run: |
          npm ci
          npm test
        shell: cmd
      - name: Gerar instalador
        shell: cmd
        run: gerar-instalador.bat
      - uses: actions/upload-artifact@v4
        with:
          name: InstaNavegador-Windows
          path: instanavegador/release/*.exe
